name: Platform compatibility

on: [push, pull_request]

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Configure Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: cargo test
      - run: cargo run --release --example throughput -- --bytes 8388608 --dir both
      - run: cargo run --release --example concurrent -- --tcp-down 4 --tcp-up 4 --udp-up 2 --udp-down 2 --bytes 8388608 --udp-bytes 1048576

  apple:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-tvos, aarch64-apple-tvos-sim]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --tests --target ${{ matrix.target }}
